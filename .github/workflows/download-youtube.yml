name: Download YouTube 21.16.240 ARMv8 and Commit

on:
  workflow_dispatch:          # manual trigger (or schedule as needed)

permissions:
  contents: write             # for pushing the APK file

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download YouTube APK
        id: download
        uses: Kingsman44/gh-apkmirror-dl@v2.0   # latest stable tag
        with:
          org: google-inc
          repo: youtube
          version: '21.16.240'              # exact version
          arch: arm64-v8a                   # target ARMv8
          dpi: 160-640dpi                   # ★ see note below
          bundle: false                     # plain APK
          filename: 'YouTube-${version}-api${minSdk}-${arch}.apk'
          overwrite: true
          DEBUG: true                       # enables verbose logs

      - name: Show downloaded metadata
        run: |
          echo "Filename: ${{ steps.download.outputs.filename }}"
          echo "Version: ${{ steps.download.outputs.version }}"
          echo "Architecture: ${{ steps.download.outputs.arch }}"
          echo "DPI: ${{ steps.download.outputs.dpi }}"
          echo "Min SDK: Android API ${{ steps.download.outputs.minSdk }}"
          echo "Signature: ${{ steps.download.outputs.signature }}"
          echo "Date: ${{ steps.download.outputs.date }}"

      - name: Commit and push APK
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${{ steps.download.outputs.filename }}"
          git commit -m "Add YouTube ${{ steps.download.outputs.filename }}" || echo "No changes to commit"
          git push
