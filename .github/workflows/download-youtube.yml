name: Download YouTube APK

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download YouTube APK using Kingsman44 action
        uses: Kingsman44/gh-apkmirror-dl@v2
        id: download
        with:
          org: 'google-inc'
          repo: 'youtube'
          version: '21.16.240'
          bundle: false
          arch: 'arm64-v8a'
          dpi: 'nodpi'
          filename: 'youtube-21.16.240.apk'
          overwrite: true

      - name: Commit and push the APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube-21.16.240.apk
          git commit -m "Add YouTube APK version ${{ steps.download.outputs.version }}" || echo "No changes to commit"
          git push
