name: Download YouTube APK

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download YouTube APK
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: 'google-inc'
          repo: 'youtube'
          version: '21.16.240'
          bundle: false
          filename: 'youtube-21.16.240.apk'

      - name: Commit and Push APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube-21.16.240.apk
          git commit -m "Add YouTube APK version 21.16.240" || echo "No changes to commit"
          git push
