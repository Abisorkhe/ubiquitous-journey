name: Download and Commit YouTube APK

on:
  workflow_dispatch:            # manual trigger (or change to push/schedule)

permissions:
  contents: write               # required to push commits

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download YouTube 21.16.240 ARMv8
        id: apk
        uses: Kingsman44/gh-apkmirror-dl@v2
        with:
          org: google-inc
          repo: youtube
          version: '21.16.240'
          arch: arm64-v8a        # ARMv8
          dpi: nodpi             # universal density
          bundle: false          # plain APK, not App Bundle
          filename: 'youtube-${version}-${arch}.apk'
          overwrite: true        # always replace if file exists

      - name: Commit and push APK
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${{ steps.apk.outputs.filename }}"
          git commit -m "Add YouTube ${{ steps.apk.outputs.filename }}" || echo "No changes to commit"
          git push
