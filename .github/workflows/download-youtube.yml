name: Download YouTube APK

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download YouTube APK
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: 'google-inc'
          repo: 'youtube'
          version: '21.16.240'
          bundle: false
          filename: 'youtube-21.16.240.apk'

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-apk
          path: youtube-21.16.240.apk
